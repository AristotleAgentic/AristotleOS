name: CI

# AristotleOS continuous integration: typecheck, test, build, and dependency
# audit for the execution-control boundary, CLI, and console UI.
# The workspace lives under extracted/ in this repository.

on:
  push:
    branches: [main, ward-warrant-execution-control, harden/production-contracts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extracted

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 22.5 is required for the built-in node:sqlite ledger backend.
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck (runtime · CLI · console-ui · adapters)
        # Install scripts are disabled, so build package entrypoints explicitly
        # before tests import workspace packages through their package mains.
        run: |
          corepack pnpm -r --filter @aristotle/shared-types --filter @aristotle/shared-schemas --filter @aristotle/governance-core --filter @aristotle/trial-engine --filter @aristotle/execution-control-runtime --filter @aristotle/mesh-runtime --filter @aristotle/os-sdk --workspace-concurrency=1 build
          corepack pnpm typecheck

      - name: Test (governance · execution-control · cli · api · chain)
        run: corepack pnpm test

      - name: Durable effect boundary and adversarial HTTP regressions
        run: corepack pnpm test:proxy-effects

      - name: Dependency backport exploit regressions
        run: node --test scripts/dependency-security.test.mjs apps/console-ui/server.security.test.mjs

      - name: Framework and MCP dependency compatibility
        run: |
          corepack pnpm -r --filter @aristotle/mcp-server-stdio... --workspace-concurrency=1 build
          corepack pnpm test:framework-adapters
          corepack pnpm test:mcp-server
          corepack pnpm test:mcp-server-stdio

      - name: Production gateway and physical adapter boundaries
        run: |
          corepack pnpm -r --filter @aristotle/mavlink-px4... --workspace-concurrency=1 build
          corepack pnpm --filter @aristotle/adapter-sdk build
          corepack pnpm --filter @aristotle/adapter-sdk test
          corepack pnpm test:protocol-adapters
          corepack pnpm test:single-drone
          corepack pnpm test:px4-sitl
          node --import tsx --test adapters/http-gateway/src/preflight.test.ts

      - name: Runtime-backed 40-asset proof and reviewer verification
        run: |
          node --import tsx --test examples/mesh/swarm-partition-40-asset.test.ts examples/mesh/published.replay.test.ts
          corepack pnpm reviewer:verify

      - name: Build CLI bundle
        run: corepack pnpm -F @aristotle/os-cli build

      - name: Build console UI
        run: corepack pnpm -F @aristotle/console-ui build

      - name: Boundary self-check
        run: node apps/aristotle-cli/dist/index.js pilot

      - name: Evaluator demo (self-verifying end-to-end walkthrough)
        run: corepack pnpm demo:evaluator

      - name: Generate SBOM (smoke)
        run: corepack pnpm sbom

      - name: Clean-room scan
        run: corepack pnpm clean-room

  cli-package:
    name: CLI package (pack + packed pilot smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI workspace prerequisites
        run: corepack pnpm -r --filter @aristotle/shared-types --filter @aristotle/shared-schemas --filter @aristotle/governance-core --filter @aristotle/trial-engine --filter @aristotle/execution-control-runtime --filter @aristotle/mesh-runtime --filter @aristotle/os-sdk --workspace-concurrency=1 build

      - name: Validate @aristotle/os-cli is publish-ready
        # Packs the CLI, asserts tarball contents, installs it into a throwaway
        # project, and runs `aristotle pilot` from the installed package.
        run: corepack pnpm package:cli:check

  helm-validate:
    name: helm chart (lint + template)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chart (lint + template, default + kind-smoke)
        run: node scripts/validate-helm.mjs

  e2e-layout:
    name: console UI layout (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: corepack pnpm -F @aristotle/console-ui exec playwright install --with-deps chromium

      - name: Layout check (build + desktop/mobile, no horizontal overflow)
        run: corepack pnpm -F @aristotle/console-ui test:e2e

  dependency-audit:
    name: dependency audit (all dependencies, blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production and build dependencies (gate)
        # Blocking gate: any dependency advisory at or above the threshold
        # (high+critical) fails the build unless triaged in .audit-allowlist.json
        # with a reason and an expiry. Expired exceptions are themselves failures.
        run: corepack pnpm audit:ci

  formal-model:
    name: bounded mesh model and negative controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned TLC
        run: curl --fail --location --output "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Check bounded models and require seeded flaws to fail
        env:
          TLA_TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: node scripts/check-formal-model.mjs
      - name: Preserve checker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-model-evidence
          path: |
            extracted/reports/formal/**/manifest.json
            extracted/reports/formal/**/tlc.txt
